# Frontend (SPA estática de Vite) — www.tudominio.com
# Copiar a /etc/nginx/sites-available/axon-frontend y reemplazar www.tudominio.com
# (y tudominio.com en el bloque de redirect de abajo).
# Certbot añadirá el bloque TLS (443) y el redirect 80 -> 443.

# Dominio raíz (apex) -> redirige a www para mantener un único origen canónico.
server {
    listen 80;
    server_name tudominio.com;
    return 301 https://www.tudominio.com$request_uri;
}

server {
    listen 80;
    server_name www.tudominio.com;

    # Archivos compilados del frontend (vite build -> dist/)
    root /var/www/axon-frontend;
    index index.html;

    # Fallback SPA: React Router maneja las rutas en el cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
