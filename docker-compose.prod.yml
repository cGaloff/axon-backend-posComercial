# Compose de PRODUCCIÓN.
# - Entorno Production: Swagger desactivado.
# - Postgres SIN puerto expuesto (solo accesible dentro de la red de Docker).
# - API expuesta solo en 127.0.0.1: Nginx (en el host) hace el proxy + TLS.
# - Toda la configuración sensible viene de .env (ver .env.prod.example).
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: axon_pymes_psql
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - axon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axon_pospymes_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:18080
      ConnectionStrings__MasterDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?define JWT_KEY en .env (min 32 chars)}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiresInMinutes: ${JWT_EXPIRES_MINUTES}
      Jwt__RefreshTokenExpiresInDays: ${JWT_REFRESH_DAYS}
      Webhooks__PaymentSecret: ${WEBHOOK_PAYMENT_SECRET:?define WEBHOOK_PAYMENT_SECRET en .env}
      Provisioning__Secret: ${PROVISIONING_SECRET:?define PROVISIONING_SECRET en .env (protege POST /api/tenants/register)}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:?define CORS_ALLOWED_ORIGINS en .env (dominios del frontend)}
      Frontend__ResetPasswordUrl: ${FRONTEND_RESET_PASSWORD_URL:?define FRONTEND_RESET_PASSWORD_URL en .env (pantalla del frontend que procesa el link de recuperación)}
      Auth__PasswordResetTokenExpiresInMinutes: ${PASSWORD_RESET_TOKEN_MINUTES:-30}
      Registration__SelfServiceEnabled: ${SELF_SERVICE_REGISTRATION_ENABLED:-false}
      Auth__RegistrationCodeExpiresInMinutes: ${REGISTRATION_CODE_MINUTES:-15}
      Subscription__TrialDays: ${SUBSCRIPTION_TRIAL_DAYS:-7}
      Subscription__ReminderDaysBeforeExpiry: ${SUBSCRIPTION_REMINDER_DAYS:-5}
      Subscription__CheckIntervalMinutes: ${SUBSCRIPTION_CHECK_INTERVAL_MINUTES:-60}
      Subscription__ExtensionSecret: ${SUBSCRIPTION_EXTENSION_SECRET:?define SUBSCRIPTION_EXTENSION_SECRET en .env}
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpPort: ${EMAIL_SMTP_PORT}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS}
      Email__FromName: ${EMAIL_FROM_NAME}
      Email__Username: ${EMAIL_USERNAME}
      Email__Password: ${EMAIL_PASSWORD}
    ports:
      # Solo localhost del host; Nginx hace el proxy hacia aquí. No expuesto a internet.
      - "127.0.0.1:18080:18080"
    networks:
      - default
      # Red compartida con el backend de facturación, que llega a este servicio
      # como http://axon_pospymes_api:18080 para dar de alta empresas. Si no se
      # declara acá, `docker compose up` recrea el contenedor SIN esta red y el
      # aprovisionamiento falla con error de conexión.
      - axon_net

volumes:
  axon_postgres_data:

networks:
  axon_net:
    external: true
